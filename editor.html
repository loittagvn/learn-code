<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Editor</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
  <h2>Playground</h2>

  <textarea id="code" style="width:100%;height:200px;"></textarea>
  <br><br>

  <button onclick="run()">Run</button>

  <iframe id="preview" style="width:100%;height:200px;"></iframe>
</div>

<div class="bottom-nav">
  <div onclick="go('index.html')">📘</div>
  <div>&lt;/&gt;</div>
  <div onclick="go('profile.html')">👤</div>
</div>

<script src="app.js"></script>
<script>
function run() {
  const code = document.getElementById('code').value;
  document.getElementById('preview').srcdoc = code;
}
</script>

</body>
</html>
